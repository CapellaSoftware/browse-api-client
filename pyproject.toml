[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browse-api-client"
version = "0.1.0"
description = "Client wrapper for the browse-api remote browser service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "patchright",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
